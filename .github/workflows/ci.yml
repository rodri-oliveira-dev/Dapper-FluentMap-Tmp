name: CI

on:
  push:
    branches:
      - master
      - chore/net10-migration
  pull_request:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  CI: "true"

permissions:
  contents: read

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: ga

      - name: Show .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ./Dapper.FluentMap.sln

      - name: Build Release
        run: dotnet build ./Dapper.FluentMap.sln --configuration Release --no-restore

      - name: Test Release
        run: dotnet test ./Dapper.FluentMap.sln --configuration Release --no-build

      - name: Pack Release
        run: dotnet pack ./Dapper.FluentMap.sln --configuration Release --no-build --output ./artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ./artifacts/packages/*.nupkg
          if-no-files-found: error
